<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>產品製成率及工時統計系統</title>
<script src="vendor/xlsx.full.min.js"></script>
<script src="vendor/chart.umd.min.js"></script>
<style>
:root {
  color-scheme: light;
  --surface-1: #ffffff;
  --surface-2: #f5f7fb;
  --page: #eaeef5;
  --text-primary: #172033;
  --text-secondary: #51607a;
  --text-muted: #7b87a0;
  --grid: #e6eaf2;
  --axis: #cdd5e3;
  --border: #dfe5f0;
  --border-soft: rgba(23,37,84,0.07);
  --brand-1: #16337f;          /* 深企業藍 */
  --brand-2: #2563eb;          /* 亮企業藍 */
  --brand-grad: linear-gradient(120deg, #14286b 0%, #1e4fd6 62%, #2f6ff0 100%);
  --accent: #2563eb;
  --accent-soft: rgba(37,99,235,0.08);
  --good: #0e9f6e;
  --good-soft: rgba(14,159,110,0.1);
  --warn: #d97706;
  --warn-soft: rgba(217,119,6,0.1);
  --critical: #dc3f34;
  --critical-soft: rgba(220,63,52,0.09);
  --band: rgba(14,159,110,0.12);
  --card-shadow: 0 1px 2px rgba(23,37,84,0.05), 0 12px 28px -16px rgba(23,37,84,0.16);
  --card-shadow-hover: 0 4px 10px rgba(23,37,84,0.08), 0 18px 38px -16px rgba(23,37,84,0.22);
  --s1:#2563eb; --s2:#eb6834; --s3:#0e9f6e; --s4:#eda100;
  --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "Inter", system-ui, -apple-system, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  background:
    radial-gradient(1100px 340px at 50% -80px, rgba(37,99,235,0.12), transparent 70%),
    var(--page);
  color: var(--text-primary);
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1180px; margin: 0 auto; padding: 20px 16px 60px; }

/* ---- 品牌頁首 ---- */
header.app {
  background: var(--brand-grad);
  border-radius: 18px;
  padding: 24px 28px;
  margin-bottom: 18px;
  color: #fff;
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px;
  box-shadow: 0 14px 34px -14px rgba(20,40,107,0.55);
  position: relative; overflow: hidden;
}
header.app::after {   /* 裝飾光斑 */
  content: ''; position: absolute; right: -60px; top: -90px;
  width: 320px; height: 320px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,0.14), transparent 65%);
  pointer-events: none;
}
header.app h1 { font-size: 24px; font-weight: 800; letter-spacing: 0.01em; }
header.app p { color: rgba(255,255,255,0.75); font-size: 13px; margin-top: 3px; width: 100%; }
.hfile {
  margin-left: auto; font-size: 12px; color: rgba(255,255,255,0.9);
  background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.22);
  padding: 5px 14px; border-radius: 999px; backdrop-filter: blur(4px);
  max-width: 46%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

.card {
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 22px;
  margin-bottom: 16px;
  box-shadow: var(--card-shadow);
}

/* upload */
#drop-zone {
  border: 2px dashed var(--axis);
  border-radius: 14px;
  padding: 44px 20px;
  text-align: center;
  cursor: pointer;
  background: var(--surface-2);
  transition: border-color .15s, background .15s;
}
#drop-zone:hover, #drop-zone.drag { border-color: var(--accent); background: var(--accent-soft); }
#drop-zone .big { font-size: 17px; font-weight: 600; }
#drop-zone .small { color: var(--text-muted); font-size: 13px; margin-top: 6px; }
#file-input { display: none; }

/* parse summary */
.summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; margin-top: 10px; }
.stat { background: var(--surface-2); border: 1px solid var(--border-soft); border-radius: 12px; padding: 11px 15px; }
.stat .k { font-size: 12px; color: var(--text-muted); }
.stat .v { font-size: 16px; font-weight: 650; margin-top: 2px; }
.stat .v small { font-size: 12px; font-weight: 400; color: var(--text-secondary); }
.rules { font-size: 12px; color: var(--text-muted); margin-top: 10px; }
.reupload { float: right; }

button {
  font: inherit; font-size: 13px;
  color: var(--text-primary);
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 6px 14px;
  cursor: pointer;
  transition: background .12s, box-shadow .12s;
}
button:hover { background: var(--accent-soft); }
button.primary, button.on {
  background: linear-gradient(135deg, #1e4fd6, #2f6ff0);
  color: #fff; border-color: transparent;
  box-shadow: 0 3px 8px -2px rgba(37,99,235,0.5);
}
.seg { display: inline-flex; gap: 0; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.seg button { border: none; border-radius: 0; padding: 6px 14px; }
.seg button + button { border-left: 1px solid var(--border); }

/* product picker */
.picker-head { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 10px; }
.picker-head h2, .section-title {
  font-size: 15px; font-weight: 750;
  display: flex; align-items: center; gap: 8px;
}
.picker-head h2::before, .section-title::before {
  content: ''; width: 4px; height: 16px; border-radius: 2px; flex: none;
  background: linear-gradient(180deg, #2f6ff0, #16337f);
}
#prod-search {
  font: inherit; font-size: 13px; padding: 7px 12px;
  border: 1px solid var(--border); border-radius: 9px;
  background: var(--surface-2); color: var(--text-primary);
  width: 240px;
}
#prod-search:focus { outline: none; border-color: var(--accent); background: var(--surface-1); }
#prod-list {
  max-height: 460px; overflow-y: auto;
  display: grid; grid-template-columns: repeat(auto-fill, minmax(238px, 1fr));
  gap: 10px; padding: 6px 2px;
}
.pcard {
  border: 1px solid var(--border); border-radius: 14px;
  background: var(--surface-1); padding: 11px 13px;
  cursor: pointer;
  transition: border-color .14s, box-shadow .14s, transform .14s;
  display: flex; flex-direction: column; gap: 6px;
  box-shadow: 0 1px 2px rgba(23,37,84,0.04);
}
.pcard:hover {
  border-color: var(--brand-2);
  box-shadow: var(--card-shadow-hover);
  transform: translateY(-2px);
}
.pcard.sel {
  border-color: var(--brand-2); background: #f3f7ff;
  box-shadow: inset 0 0 0 1px var(--brand-2);
}
.pcard .row1 { display: flex; align-items: center; gap: 7px; }
.pcard .code { font-weight: 700; font-size: 14px; }
.pcard .cnt { font-size: 11px; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 1px 8px; }
.pcard input { accent-color: var(--accent); width: 15px; height: 15px; margin-left: auto; flex: none; cursor: pointer; }
.pcard .name { font-size: 12px; color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pcard .badges { display: flex; flex-wrap: wrap; gap: 4px; }
.pbadge { font-size: 11px; padding: 1px 7px; border-radius: 999px; white-space: nowrap; }
.pbadge.ok   { color: var(--good, #2e7d32); background: rgba(46,125,50,0.1); }
.pbadge.warn { color: var(--critical); background: rgba(214,69,60,0.1); }
.pbadge.mut  { color: var(--text-muted); background: var(--surface-1); border: 1px solid var(--border-soft); }
.pcard .costline { font-size: 12px; color: var(--text-primary); font-variant-numeric: tabular-nums; }
.pcard .costline .up { color: var(--critical); font-weight: 650; }
.pcard .costline .down { color: var(--good, #2e7d32); font-weight: 650; }

/* product detail */
.detail-head { display: flex; align-items: flex-start; gap: 12px; }
.detail-head h2 { font-size: 17px; font-weight: 750; }
.detail-head .sub { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
.detail-head .close { margin-left: auto; }
.dkpis { display: flex; flex-wrap: wrap; gap: 10px; margin: 12px 0 4px; }
.dtable-wrap { overflow-x: auto; max-height: 380px; overflow-y: auto; margin-top: 8px; }
.dtable-wrap thead th { position: sticky; top: 0; background: var(--surface-2); z-index: 1; }
/* 每鍋成本欄整條框選凸顯（逐批明細） */
.mtable thead th.ccol {
  border-top: 2px solid var(--brand-2); border-left: 2px solid var(--brand-2); border-right: 2px solid var(--brand-2);
  background: #dbe8ff; color: var(--brand-1);
}
.mtable tbody tr td.ccol {
  border-left: 2px solid var(--brand-2); border-right: 2px solid var(--brand-2);
  background: #edf3ff; font-size: 13px;
}
.mtable tbody tr:last-child td.ccol { border-bottom: 2px solid var(--brand-2); }
.mtable tbody tr.anomrow td, .mtable tbody tr.anomrow:hover td { background: var(--critical-soft); color: var(--text-muted); }
.mtable tbody tr.anomrow td.reason { color: var(--critical); text-align: left; }
.dcharts { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 18px; }
.dcharts .full { grid-column: 1 / -1; }
@media (max-width: 900px) { .dcharts { grid-template-columns: 1fr; } }
.dchart-title { font-size: 13px; font-weight: 650; margin-bottom: 6px; }
.dchart-note { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; padding: 3px 10px;
  border: 1px solid var(--border); border-radius: 999px;
  background: var(--surface-2);
}
.chip .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.chip b { font-weight: 650; }
.chip .x { cursor: pointer; color: var(--text-muted); padding: 0 2px; }
.chip .x:hover { color: var(--critical); }

/* toolbar */
.toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.toolbar .lbl { font-size: 13px; color: var(--text-secondary); }

/* charts */
.chart-card h3 { font-size: 15px; font-weight: 700; }
.chart-card .sub { font-size: 12px; color: var(--text-muted); }
.chart-head { display: flex; flex-wrap: wrap; gap: 10px; align-items: baseline; justify-content: space-between; margin-bottom: 8px; }
.chart-box { position: relative; height: 300px; }
.legend-row { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--text-secondary); margin-top: 8px; }
.legend-row .li { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 12px; height: 12px; border-radius: 3px; flex: none; }
.sw.line { height: 0; border-top: 2px dashed var(--text-muted); border-radius: 0; width: 18px; }
.sw.solidline { height: 0; border-top: 2px solid var(--text-muted); border-radius: 0; width: 18px; }
.kpis, .dkpis { display: flex; flex-wrap: wrap; gap: 12px; margin: 10px 0 12px; }
.kpi {
  border: 1px solid var(--border-soft); border-radius: 14px;
  padding: 12px 18px; min-width: 158px; flex: 1 1 158px; max-width: 260px;
  position: relative; overflow: hidden;
}
.kpi::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; }
/* 輪播色系：藍→靛→琥珀→綠→灰 */
.kpis .kpi:nth-child(5n+1), .dkpis .kpi:nth-child(5n+1) { background: #eef4ff; }
.kpis .kpi:nth-child(5n+1)::before, .dkpis .kpi:nth-child(5n+1)::before { background: #2563eb; }
.kpis .kpi:nth-child(5n+2), .dkpis .kpi:nth-child(5n+2) { background: #f1efff; }
.kpis .kpi:nth-child(5n+2)::before, .dkpis .kpi:nth-child(5n+2)::before { background: #6d5ae8; }
.kpis .kpi:nth-child(5n+3), .dkpis .kpi:nth-child(5n+3) { background: #fff6ea; }
.kpis .kpi:nth-child(5n+3)::before, .dkpis .kpi:nth-child(5n+3)::before { background: #d97706; }
.kpis .kpi:nth-child(5n+4), .dkpis .kpi:nth-child(5n+4) { background: #ecfaf3; }
.kpis .kpi:nth-child(5n+4)::before, .dkpis .kpi:nth-child(5n+4)::before { background: #0e9f6e; }
.kpis .kpi:nth-child(5n+5), .dkpis .kpi:nth-child(5n+5) { background: var(--surface-2); }
.kpis .kpi:nth-child(5n+5)::before, .dkpis .kpi:nth-child(5n+5)::before { background: #7b87a0; }
.kpi .k { font-size: 11.5px; color: var(--text-secondary); font-weight: 600; letter-spacing: 0.02em; }
.kpi .v { font-size: 27px; font-weight: 800; letter-spacing: -0.01em; line-height: 1.25; font-variant-numeric: tabular-nums; }
.kpi .v small { font-size: 12px; font-weight: 500; color: var(--text-secondary); letter-spacing: 0; }
.kpi .d { font-size: 11px; }
.kpi .d.up { color: var(--critical); }
.kpi .d.down { color: var(--good); }

table.mtable { border-collapse: collapse; width: 100%; font-size: 12.5px; margin-top: 10px; }
.mtable th, .mtable td { border: none; border-bottom: 1px solid var(--grid); padding: 6px 10px; text-align: right; font-variant-numeric: tabular-nums; }
.mtable th:first-child, .mtable td:first-child { text-align: left; }
.mtable thead th { background: #eef2fa; color: var(--brand-1); font-weight: 700; border-bottom: 2px solid #cdd9f3; }
.mtable tbody tr:nth-child(even) td { background: #f8fafd; }
.mtable tbody tr:hover td { background: var(--accent-soft); }
.mtable td.bad { color: var(--critical); font-weight: 650; }
.mtable-wrap { overflow-x: auto; border-radius: 10px; }

.note { font-size: 12px; color: var(--text-muted); }
.cost-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px; margin-bottom: 10px; }
.cost-head #cost-sub { margin-top: 4px; max-width: 720px; line-height: 1.5; }
.cost-controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.cost-controls label { display: inline-flex; align-items: center; color: var(--text-secondary); }
/* 費率膠囊：全頁金額的唯一變因，做得夠醒目 */
.rate-box {
  display: inline-flex; align-items: center; gap: 6px;
  background: linear-gradient(135deg, #eef4ff, #dfeaff);
  border: 1.5px solid #a9c3f2; border-radius: 999px;
  padding: 5px 14px 5px 12px;
  font-size: 13px; font-weight: 700; color: var(--brand-1);
  box-shadow: 0 2px 6px -2px rgba(37,99,235,0.35);
}
#cost-rate {
  width: 64px; border: none; background: transparent;
  font: inherit; font-size: 16px; font-weight: 800; color: var(--brand-1);
  text-align: right; font-variant-numeric: tabular-nums;
}
#cost-rate:focus { outline: none; }
.rate-box .unit { font-size: 11px; font-weight: 600; color: var(--text-secondary); }
/* 費率變更 → 受影響金額閃爍 */
@keyframes mflash {
  0% { background: #ffdf8e; box-shadow: 0 0 0 3px #ffdf8e; }
  100% { background: transparent; box-shadow: none; }
}
.mny { border-radius: 4px; }
.mny.flash { animation: mflash 1.4s ease-out; }
#cost-search { padding: 7px 12px; border: 1px solid var(--border); border-radius: 8px;
  background: var(--surface-2); color: var(--text-primary); font-size: 13px; min-width: 200px; }
#cost-search:focus { outline: none; border-color: var(--accent); background: var(--surface-1); }
#cost-anom { margin-bottom: 8px; }
#cost-anom #anom-toggle { font-size: 12px; padding: 4px 10px; color: var(--critical); }
.cost-anom-list { margin-top: 8px; }
.mtable td.mut { color: var(--text-muted); }
.cost-tbl { table-layout: fixed; }
.cost-tbl th, .cost-tbl td { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cost-tbl th.lft { text-align: left; }
.cost-tbl col.c-code  { width: 88px; }
.cost-tbl col.c-name  { width: auto; }
.cost-tbl col.c-hr    { width: 78px; }
.cost-tbl col.c-cost  { width: 96px; }
.cost-tbl col.c-batch { width: 62px; }
.cost-tbl col.c-diff  { width: 80px; }
.cost-tbl td:nth-child(2) { white-space: normal; }
/* 兩期分組：基準期灰藍、當期亮藍，粗線分隔避免黏在一起 */
.cost-tbl thead th.p25 { background: #eaeef7; color: #51607a; }
.cost-tbl thead th.p26 { background: #dbe8ff; color: var(--brand-1); }
.cost-tbl thead th.s25 { background: #f0f3fa; }
.cost-tbl thead th.s26 { background: #e7effe; }
.cost-tbl .pchip {
  font-size: 10px; font-weight: 700; padding: 1px 8px; border-radius: 999px;
  margin-left: 7px; vertical-align: 1px;
}
.cost-tbl .p25 .pchip { background: #cbd5e6; color: #43506a; }
.cost-tbl .p26 .pchip { background: var(--brand-2); color: #fff; }
.cost-tbl th.gs, .cost-tbl td.gs { border-left: 2.5px solid #b9c8e8; }
.cost-tbl tbody tr td:nth-child(3), .cost-tbl tbody tr td:nth-child(4), .cost-tbl tbody tr td:nth-child(5) { background: #f4f6fb; }
.cost-tbl tbody tr td:nth-child(6), .cost-tbl tbody tr td:nth-child(7), .cost-tbl tbody tr td:nth-child(8) { background: #ecf2fe; }
.cost-tbl tbody tr:hover td { background: var(--accent-soft); }
.hidden { display: none !important; }

/* 詳情展開入場動畫 */
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
#detail-card:not(.hidden) { animation: fadeUp .28s ease-out; }
#prod-list { scrollbar-width: thin; }

@media print {
  #upload-card, .picker-card, .toolbar-card, .no-print { display: none !important; }
  body { background: #fff; }
  header.app { background: #16337f !important; box-shadow: none; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .card { break-inside: avoid; box-shadow: none; border-color: #d5d8de; }
  .kpi { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="app">
    <h1>📊 產品製成率及工時統計系統</h1>
    <span class="hfile hidden" id="hdr-file"></span>
    <p>上傳最新的生產資料 Excel 檔，於瀏覽器本機解析，不會上傳到任何伺服器。</p>
  </header>

  <!-- upload -->
  <div class="card" id="upload-card">
    <div id="drop-zone">
      <div class="big">點擊選取或拖曳 xlsx 檔案至此</div>
      <div class="small">需含「資料總表」與「工時」分頁（另可含 112年全品項生產鍋數／生產達成率(目標)）</div>
    </div>
    <input type="file" id="file-input" accept=".xlsx,.xlsm,.xls">
  </div>

  <!-- parse summary -->
  <div class="card hidden" id="summary-card">
    <button class="reupload no-print" onclick="resetAll()">重新上傳</button>
    <div class="section-title">資料解析摘要</div>
    <div class="summary-grid" id="summary-grid"></div>
    <div class="rules" id="summary-rules"></div>
  </div>

  <!-- product picker：唯一的選擇入口 -->
  <div class="card picker-card hidden" id="picker-card">
    <div class="picker-head">
      <h2>選擇品項</h2>
      <input type="text" id="prod-search" placeholder="輸入品號或品名，點卡片展開分析…">
      <label class="rate-box" title="全頁所有 $ 金額均以此費率換算，修改後變動處會亮起">💰 工時費率
        <input type="number" id="cost-rate" value="200" min="0" step="10"><span class="unit">$/人時</span></label>
      <span class="lbl" style="font-size:13px;color:var(--text-secondary)">排序</span>
      <div class="seg" id="sort-seg"></div>
      <span class="note" id="pick-count"></span>
      <button onclick="clearSelection()" id="clear-btn" class="hidden">全部取消</button>
    </div>
    <div id="prod-list"></div>
    <div class="chips" id="chips"></div>
  </div>

  <!-- product detail (single item deep-dive) -->
  <div class="card hidden" id="detail-card"></div>

  <!-- 全品項成本總表（折疊） -->
  <div class="card hidden" id="cost-card">
    <div class="cost-head">
      <button id="cost-toggle" style="font-weight:650">▶ 全品項成本總表（橫向比較）</button>
    </div>
    <div id="cost-body" class="hidden">
      <div class="note" id="cost-sub" style="margin-bottom:8px"></div>
      <div id="cost-anom" class="note"></div>
      <div class="mtable-wrap" id="cost-table"></div>
    </div>
  </div>

  <!-- year toolbar -->
  <div class="card toolbar-card hidden" id="toolbar-card">
    <div class="toolbar">
      <span class="lbl">年份</span>
      <div class="seg" id="year-seg"></div>
      <span class="note">月度圖 X 軸固定 1–12 月；未生產或不足月的月份留空。</span>
      <button class="no-print" style="margin-left:auto" onclick="window.print()">列印報表</button>
    </div>
  </div>

  <!-- overview comparison -->
  <div class="card chart-card hidden" id="overview-card">
    <div class="chart-head">
      <div>
        <h3>多產品比較</h3>
        <div class="sub" id="overview-sub"></div>
      </div>
      <div class="seg" id="overview-metric-seg"></div>
    </div>
    <div class="chart-box"><canvas id="overview-canvas"></canvas></div>
    <div class="legend-row" id="overview-legend"></div>
  </div>

  <!-- per-product cards -->
  <div id="cards"></div>

  <footer class="note" style="margin-top:30px">
    資料來源：上傳之生產資料檔｜統計規則：月度僅計「足月」資料（資料起訖落在月中的月份與進行中的當月不計）；
    已排除專案列、無實際生產數據列與未來排程列。｜分析日期：<span id="today"></span>
  </footer>
</div>

<script>
'use strict';
document.getElementById('today').textContent = new Date().toLocaleDateString('zh-TW');

/* ================= 全域狀態 ================= */
const state = {
  workAgg: new Map(),   // "code|y|m" -> {total, man, pots, n}
  yieldAgg: new Map(),  // "code|y|m" -> {est, act, n}
  costAgg: new Map(),   // "code|y|m" -> {personMin, pots, n}（自算人時，已通過核對）
  costRecords: [],      // 每場明細 [{d, code, pots, p1, m1, p2, m2, personMin}]
  costRange: null,      // 成本有效列的日期範圍
  costAnoms: [],        // 異常列 [{date, dkey, code, name, computed, oVal, reason}]
  costValid: 0,
  products: new Map(),  // code -> {code, name, workN, yieldN}
  workRange: null,      // {min:{y,m,d}, max:{y,m,d}}
  yieldRange: null,
  years: [],
  year: null,
  selected: [],         // [{code, slot}]
  sort: { key: 'code', dir: 'asc' },  // 料號/筆數，升冪/降冪
  charts: {},           // id -> Chart instance
};
const SLOT_VARS = ['--s1','--s2','--s3','--s4','--s5','--s6','--s7','--s8'];
const NON_PRODUCT_CODES = new Set(['專案', '研發', '-']);
const MAX_SELECT = 8;
const MONTH_LABELS = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function withAlpha(hex, a) {
  const h = hex.replace('#','');
  const r = parseInt(h.slice(0,2),16), g = parseInt(h.slice(2,4),16), b = parseInt(h.slice(4,6),16);
  return `rgba(${r},${g},${b},${a})`;
}

/* ================= 日期解析 ================= */
function excelSerialToYMD(serial) {
  const ms = Math.round(serial) * 86400000 + Date.UTC(1899, 11, 30);
  const d = new Date(ms);
  return { y: d.getUTCFullYear(), m: d.getUTCMonth() + 1, d: d.getUTCDate() };
}
function ymdKey(o) { return o.y * 10000 + o.m * 100 + o.d; }
function validYMD(y, m, d) {
  if (m < 1 || m > 12 || d < 1) return false;
  return d <= new Date(Date.UTC(y, m, 0)).getUTCDate();
}
/** 逐列解析日期欄：支援 Excel 序號、'YYYY/M/D' 完整字串、'M/D' 無年份字串。
 *  無年份字串以前後最近的絕對日期為錨點推斷年份（資料須為時間順序，跨年自動 +1）。 */
function parseDateColumn(raw) {
  const n = raw.length;
  const abs = new Array(n).fill(null);
  const rel = new Array(n).fill(null);
  for (let i = 0; i < n; i++) {
    const v = raw[i];
    if (v == null) continue;
    if (typeof v === 'number') {
      if (v > 20000 && v < 80000) abs[i] = excelSerialToYMD(v);
      continue;
    }
    if (typeof v !== 'string') continue;
    const s = v.trim().replace(/[.\-年月]/g, '/').replace(/日/g, '');
    const parts = s.split('/').map(p => p.trim()).filter(p => p !== '');
    const nums = parts.map(p => parseInt(p, 10));
    if (nums.some(isNaN)) continue;
    if (nums.length === 3) {
      let [y, m, d] = nums;
      if (y < 1000) y += 1911; // 民國年
      if (validYMD(y, m, d)) abs[i] = { y, m, d };
    } else if (nums.length === 2) {
      rel[i] = { m: nums[0], d: nums[1] };
    }
  }
  // 向前掃：錨點之後的無年份日期
  let last = null;
  for (let i = 0; i < n; i++) {
    if (abs[i]) { last = abs[i]; continue; }
    if (rel[i] && last) {
      for (const y of [last.y, last.y + 1]) {
        if (!validYMD(y, rel[i].m, rel[i].d)) continue;
        const c = { y, m: rel[i].m, d: rel[i].d };
        if (ymdKey(c) >= ymdKey(last)) { abs[i] = c; last = c; break; }
      }
    }
  }
  // 向後掃：第一個錨點之前的無年份日期
  let next = null;
  for (let i = n - 1; i >= 0; i--) {
    if (abs[i]) { next = abs[i]; continue; }
    if (rel[i] && next) {
      for (const y of [next.y, next.y - 1]) {
        if (!validYMD(y, rel[i].m, rel[i].d)) continue;
        const c = { y, m: rel[i].m, d: rel[i].d };
        if (ymdKey(c) <= ymdKey(next)) { abs[i] = c; next = c; break; }
      }
    }
  }
  return abs;
}

/* ================= 工具 ================= */
function toNum(v) {
  if (v == null) return null;
  if (typeof v === 'number') return isFinite(v) ? v : null;
  if (typeof v === 'string') {
    const s = v.trim().replace(/,/g, '');
    if (s === '') return null;
    const f = parseFloat(s);
    return isNaN(f) ? null : f;
  }
  return null;
}
function normHeader(v) { return v == null ? '' : String(v).replace(/\s/g, ''); }
function findCol(headers, includes, fallback) {
  for (let i = 0; i < headers.length; i++) {
    const h = normHeader(headers[i]);
    if (h && includes.every(k => h.includes(k))) return i;
  }
  return fallback;
}
/** 時刻/時長儲存格 → 分鐘。支援 Excel 日內分數、'H:MM' 字串。 */
function timeToMin(v) {
  if (v == null || v === '') return null;
  if (typeof v === 'number') {
    if (!isFinite(v)) return null;
    const frac = v >= 1 ? v - Math.floor(v) : v;   // 取日內小數部分
    return Math.round(frac * 1440);
  }
  if (typeof v === 'string') {
    const s = v.trim();
    const m = s.match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?$/);
    if (m) return (+m[1]) * 60 + (+m[2]) + (m[3] ? Math.round(+m[3] / 60) : 0);
    const f = parseFloat(s);
    if (!isNaN(f) && f > 0 && f < 1) return Math.round(f * 1440);
    return null;
  }
  return null;
}
const LUNCH_FROM = 12 * 60, LUNCH_TO = 13 * 60;   // 午休 12:00–13:00 一律扣除
/** 判定單段作業狀態：
 *  empty = 完全空白（時間與人數皆無）→ 非人工列；
 *  bad   = 有填但不完整/異常（缺時間、缺人數、結束≤開始）→ 資料不全；
 *  ok    = 時間與人數皆齊全，min 為工時(分)=(結束−開始)−午休+前置。 */
function classifyStage(startMin, endMin, prepMin, people) {
  const hasTime = startMin != null || endMin != null;
  const hasPeople = people != null && people > 0;
  if (!hasTime && !hasPeople) return { kind: 'empty', why: '未填資料' };
  if (startMin == null || endMin == null || endMin <= startMin) return { kind: 'bad', why: '缺／異常生產時間' };
  if (!hasPeople) return { kind: 'bad', why: '缺人數' };
  let d = endMin - startMin;
  d -= Math.max(0, Math.min(endMin, LUNCH_TO) - Math.max(startMin, LUNCH_FROM));
  d += (prepMin || 0);
  if (d <= 0) return { kind: 'bad', why: '生產時間為 0' };
  return { kind: 'ok', why: '', min: d, people };
}
function monthDays(y, m) { return new Date(Date.UTC(y, m, 0)).getUTCDate(); }
function monthComplete(y, m, range) {
  if (!range) return false;
  const startK = y * 10000 + m * 100 + 1;
  const endK = y * 10000 + m * 100 + monthDays(y, m);
  return startK >= ymdKey(range.min) && endK <= ymdKey(range.max);
}
function fmt(v, dec) {
  if (v == null || !isFinite(v)) return '–';
  return v.toLocaleString('zh-TW', { minimumFractionDigits: dec, maximumFractionDigits: dec });
}
function fmtDate(o) { return `${o.y}/${o.m}/${o.d}`; }

/* ================= 檔案解析 ================= */
const dropZone = document.getElementById('drop-zone');
const fileInput = document.getElementById('file-input');
dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag'));
dropZone.addEventListener('drop', e => {
  e.preventDefault(); dropZone.classList.remove('drag');
  if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', e => { if (e.target.files.length) handleFile(e.target.files[0]); });

function handleFile(file) {
  if (!/\.(xlsx|xlsm|xls)$/i.test(file.name)) { alert('請選擇 .xlsx / .xlsm 檔案'); return; }
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array', cellDates: false });
      parseWorkbook(wb, file.name);
    } catch (err) {
      alert('檔案解析失敗：' + err.message);
      console.error(err);
    }
  };
  reader.readAsArrayBuffer(file);
}

function findSheet(wb, name) {
  if (wb.Sheets[name]) return wb.Sheets[name];
  const hit = wb.SheetNames.find(n => n.replace(/\s/g, '').includes(name));
  return hit ? wb.Sheets[hit] : null;
}

function parseWorkbook(wb, filename) {
  const wsWork = findSheet(wb, '工時');
  const wsMain = findSheet(wb, '資料總表');
  if (!wsWork || !wsMain) {
    alert('找不到「工時」或「資料總表」分頁，請確認檔案格式。\n偵測到的分頁：' + wb.SheetNames.join('、'));
    return;
  }
  // reset state
  state.workAgg = new Map(); state.yieldAgg = new Map(); state.products = new Map();
  state.selected = []; state.workRange = null; state.yieldRange = null;
  state.costAgg = new Map(); state.costRange = null; state.costAnoms = []; state.costValid = 0;
  state.costRecords = [];

  /* ---- 工時 ---- */
  const wRows = XLSX.utils.sheet_to_json(wsWork, { header: 1, defval: null, raw: true });
  const wh = wRows[0] || [];
  const wc = {
    date: findCol(wh, ['日期'], 0),
    code: findCol(wh, ['料號'], 1),
    name: findCol(wh, ['品項'], 2),
    pots: findCol(wh, ['鍋數'], 3),
    man:  findCol(wh, ['生產時間', '人數'], 14),
    total: findCol(wh, ['總生產時間'], 17),
  };
  const wBody = wRows.slice(1);
  const wDates = parseDateColumn(wBody.map(r => r[wc.date]));
  let workValid = 0, workSkipped = 0;
  let wMin = null, wMax = null;
  const workRecords = [];
  for (let i = 0; i < wBody.length; i++) {
    const r = wBody[i];
    const isEmpty = r.every(v => v == null || v === '');
    if (isEmpty) continue;
    const d = wDates[i];
    const code = typeof r[wc.code] === 'string' ? r[wc.code].trim() : (r[wc.code] != null ? String(r[wc.code]) : '');
    const name = typeof r[wc.name] === 'string' ? r[wc.name].trim() : '';
    const pots = toNum(r[wc.pots]);
    const total = toNum(r[wc.total]);
    const man = toNum(r[wc.man]);
    const headerLike = normHeader(r[wc.code]) === '料號';
    if (headerLike) continue;
    if (!d || !code || NON_PRODUCT_CODES.has(code) || name === '#N/A' || pots == null || pots <= 0 || total == null || total <= 0) {
      workSkipped++; continue;
    }
    workValid++;
    workRecords.push({ d, code, name, pots, total, man: man || 0 });
    if (!wMin || ymdKey(d) < ymdKey(wMin)) wMin = d;
    if (!wMax || ymdKey(d) > ymdKey(wMax)) wMax = d;
  }
  state.workRange = wMin ? { min: wMin, max: wMax } : null;

  /* ---- 成本（每鍋人力成本）：系統自算人時，與 O 欄核對，不一致者列為異常剔除 ---- */
  // 兩段作業欄位為固定版面：製造 E/F/G/H(idx4-7)、充填 J/K/L/M(idx9-12)、人時 O(生產時間*人數)
  const cc = { e1: 4, prep1: 5, g1: 6, h1: 7, e2: 9, prep2: 10, g2: 11, h2: 12,
               o: findCol(wh, ['生產時間', '人數'], 14) };
  let cMin = null, cMax = null;
  for (let i = 0; i < wBody.length; i++) {
    const r = wBody[i];
    if (r.every(v => v == null || v === '')) continue;
    if (normHeader(r[wc.code]) === '料號') continue;
    const d = wDates[i];
    const code = typeof r[wc.code] === 'string' ? r[wc.code].trim() : (r[wc.code] != null ? String(r[wc.code]) : '');
    const name = typeof r[wc.name] === 'string' ? r[wc.name].trim() : '';
    if (!code || NON_PRODUCT_CODES.has(code) || name === '#N/A') continue;
    const pots = toNum(r[wc.pots]);
    const E = toNum(r[cc.e1]), J = toNum(r[cc.e2]);
    const st1 = classifyStage(timeToMin(r[cc.g1]), timeToMin(r[cc.h1]), timeToMin(r[cc.prep1]), E);
    const st2 = classifyStage(timeToMin(r[cc.g2]), timeToMin(r[cc.h2]), timeToMin(r[cc.prep2]), J);
    const oVal = toNum(r[cc.o]);
    // 兩段皆完全空白 → 非人工列，略過（不報錯）
    if (st1.kind === 'empty' && st2.kind === 'empty') continue;
    // 判斷異常原因（兩段都必須完整才計算）
    let reason = null;
    let computed = null;
    if (st1.kind !== 'ok' || st2.kind !== 'ok') {
      const parts = [];
      if (st1.kind !== 'ok') parts.push('第一段(製造)' + st1.why);
      if (st2.kind !== 'ok') parts.push('第二段(充填)' + st2.why);
      reason = '資料不全：' + parts.join('、');
    } else {
      computed = st1.min * st1.people + st2.min * st2.people;
      if (!d) reason = '日期無效';
      else if (pots == null || pots <= 0) reason = '缺鍋數';
      else if (oVal == null) reason = '缺「生產時間*人數」欄，無法核對';
      else if (Math.abs(computed - oVal) > 1) reason = `自算人時 ${Math.round(computed)} ≠ 表列 ${fmt(oVal, 0)}（記錄可能有誤）`;
    }
    if (reason) {
      state.costAnoms.push({ date: d ? fmtDate(d) : '—', dkey: d ? ymdKey(d) : 0, code, name, computed: computed != null ? Math.round(computed) : null, oVal, reason });
      continue;
    }
    // 通過核對 → 納入
    state.costValid++;
    state.costRecords.push({ d, code, pots, p1: st1.people, m1: st1.min, p2: st2.people, m2: st2.min, personMin: computed });
    const k = `${code}|${d.y}|${d.m}`;
    let a = state.costAgg.get(k);
    if (!a) { a = { personMin: 0, pots: 0, n: 0 }; state.costAgg.set(k, a); }
    a.personMin += computed; a.pots += pots; a.n++;
    if (!cMin || ymdKey(d) < ymdKey(cMin)) cMin = d;
    if (!cMax || ymdKey(d) > ymdKey(cMax)) cMax = d;
  }
  state.costRange = cMin ? { min: cMin, max: cMax } : null;

  /* ---- 資料總表（製成率） ---- */
  const yRows = XLSX.utils.sheet_to_json(wsMain, { header: 1, defval: null, raw: true });
  const yh = yRows[0] || [];
  const yc = {
    date: findCol(yh, ['日期'], 0),
    code: findCol(yh, ['料號'], 1),
    name: findCol(yh, ['品項'], 2),
    pots: findCol(yh, ['鍋數'], 3),
    est:  findCol(yh, ['半成品數', '預估'], 6),
    act:  findCol(yh, ['半成品數', '實際'], 7),
  };
  const yBody = yRows.slice(1);
  const yDates = parseDateColumn(yBody.map(r => r[yc.date]));
  let yieldValid = 0, yieldSkipped = 0;
  let yMin = null, yMax = null;
  const yieldRecords = [];
  for (let i = 0; i < yBody.length; i++) {
    const r = yBody[i];
    if (r.every(v => v == null || v === '')) continue;
    const d = yDates[i];
    const code = typeof r[yc.code] === 'string' ? r[yc.code].trim() : (r[yc.code] != null ? String(r[yc.code]) : '');
    const name = typeof r[yc.name] === 'string' ? r[yc.name].trim() : '';
    const est = toNum(r[yc.est]);
    const act = toNum(r[yc.act]);
    if (normHeader(r[yc.code]) === '料號') continue;
    if (!d || !code || NON_PRODUCT_CODES.has(code) || est == null || est <= 0 || act == null || act <= 0) {
      yieldSkipped++; continue;
    }
    yieldValid++;
    yieldRecords.push({ d, code, name, est, act });
    if (!yMin || ymdKey(d) < ymdKey(yMin)) yMin = d;
    if (!yMax || ymdKey(d) > ymdKey(yMax)) yMax = d;
  }
  state.yieldRange = yMin ? { min: yMin, max: yMax } : null;

  /* ---- 彙總 ---- */
  for (const rec of workRecords) {
    const k = `${rec.code}|${rec.d.y}|${rec.d.m}`;
    let a = state.workAgg.get(k);
    if (!a) { a = { total: 0, man: 0, pots: 0, n: 0 }; state.workAgg.set(k, a); }
    a.total += rec.total; a.man += rec.man; a.pots += rec.pots; a.n++;
    let p = state.products.get(rec.code);
    if (!p) { p = { code: rec.code, name: rec.name, workN: 0, yieldN: 0 }; state.products.set(rec.code, p); }
    p.workN++;
    if (!p.name && rec.name) p.name = rec.name;
  }
  for (const rec of yieldRecords) {
    const k = `${rec.code}|${rec.d.y}|${rec.d.m}`;
    let a = state.yieldAgg.get(k);
    if (!a) { a = { est: 0, act: 0, n: 0 }; state.yieldAgg.set(k, a); }
    a.est += rec.est; a.act += rec.act; a.n++;
    let p = state.products.get(rec.code);
    if (!p) { p = { code: rec.code, name: rec.name, workN: 0, yieldN: 0 }; state.products.set(rec.code, p); }
    p.yieldN++;
    if (!p.name && rec.name) p.name = rec.name;
  }

  /* ---- 年份 ---- */
  const yearSet = new Set();
  const ranges = [state.workRange, state.yieldRange].filter(Boolean);
  for (const rg of ranges) {
    for (let y = rg.min.y; y <= rg.max.y; y++) {
      for (let m = 1; m <= 12; m++) if (monthComplete(y, m, rg)) { yearSet.add(y); break; }
    }
  }
  state.years = [...yearSet].sort();
  state.year = state.years[state.years.length - 1] || null;

  renderSummary(filename, { workValid, workSkipped, yieldValid, yieldSkipped });
  document.getElementById('upload-card').classList.add('hidden');
  document.getElementById('summary-card').classList.remove('hidden');
  document.getElementById('cost-card').classList.remove('hidden');
  document.getElementById('picker-card').classList.remove('hidden');
  detailCode = null;
  document.getElementById('detail-card').classList.add('hidden');
  renderYearSeg();
  renderSortControl();
  renderCost();
  renderProductList();
  renderChips();
  renderAll();
}

function completeMonthSpan(range) {
  if (!range) return '—';
  const list = [];
  for (let y = range.min.y; y <= range.max.y; y++)
    for (let m = 1; m <= 12; m++) if (monthComplete(y, m, range)) list.push(`${y}/${m}`);
  if (!list.length) return '—';
  return `${list[0]} ~ ${list[list.length - 1]}`;
}

function renderSummary(filename, s) {
  const hf = document.getElementById('hdr-file');
  hf.textContent = `${filename} · 分析日期 ${new Date().toLocaleDateString('zh-TW')}`;
  hf.classList.remove('hidden');
  const g = document.getElementById('summary-grid');
  const wr = state.workRange, yr = state.yieldRange;
  g.innerHTML = `
    <div class="stat"><div class="k">檔案</div><div class="v" style="font-size:13px">${filename}</div></div>
    <div class="stat"><div class="k">工時資料</div><div class="v">${s.workValid.toLocaleString()} 筆 <small>（排除 ${s.workSkipped} 筆）</small></div>
      <div class="k">${wr ? fmtDate(wr.min) + ' ~ ' + fmtDate(wr.max) : '—'}</div></div>
    <div class="stat"><div class="k">製成率資料（資料總表）</div><div class="v">${s.yieldValid.toLocaleString()} 筆 <small>（排除 ${s.yieldSkipped} 筆）</small></div>
      <div class="k">${yr ? fmtDate(yr.min) + ' ~ ' + fmtDate(yr.max) : '—'}</div></div>
    <div class="stat"><div class="k">成本可計資料</div><div class="v">${state.costValid.toLocaleString()} 筆 <small>（排除異常 ${state.costAnoms.length} 筆）</small></div>
      <div class="k">異常清單見「全品項成本總表」</div></div>
    <div class="stat"><div class="k">產品數</div><div class="v">${state.products.size} 項</div></div>

/* ================= 指標定義 ================= */
const METRICS = [
  { key: 'total',  label: '總生產時間', unit: '分', dec: 0, src: 'work',
    calc: a => a.total },
  { key: 'perpot', label: '每鍋工時', unit: '分/鍋', dec: 2, src: 'work',
    calc: a => a.pots > 0 ? a.total / a.pots : null },
  { key: 'manpot', label: '每鍋人時', unit: '人時/鍋', dec: 2, src: 'cost',
    calc: a => a.pots > 0 ? (a.personMin / 60) / a.pots : null },
  { key: 'rate',   label: '製成率', unit: '%', dec: 1, src: 'yield',
    calc: a => a.est > 0 ? a.act / a.est * 100 : null },
];
function metricByKey(k) { return METRICS.find(m => m.key === k); }
function aggFor(src) { return src === 'work' ? state.workAgg : src === 'cost' ? state.costAgg : state.yieldAgg; }
function rangeFor(src) { return src === 'work' ? state.workRange : src === 'cost' ? state.costRange : state.yieldRange; }

/** 某產品某年 12 個月的指標值（不足月 → null） */
function monthlySeries(code, year, metric) {
  const agg = aggFor(metric.src), range = rangeFor(metric.src);
  const out = [];
  for (let m = 1; m <= 12; m++) {
    if (!monthComplete(year, m, range)) { out.push(null); continue; }
    const a = agg.get(`${code}|${year}|${m}`);
    out.push(a ? metric.calc(a) : null);
  }
  return out;
}

/** 去年年度平均：total → 有生產足月的月平均；比例類 → 全年加總後相除（僅足月） */
function baseline(code, year, metric) {
  const py = year - 1;
  const agg = aggFor(metric.src), range = rangeFor(metric.src);
  let total = 0, personMin = 0, pots = 0, est = 0, act = 0, months = 0;
  for (let m = 1; m <= 12; m++) {
    if (!monthComplete(py, m, range)) continue;
    const a = agg.get(`${code}|${py}|${m}`);
    if (!a) continue;
    months++;
    if (metric.src === 'work') { total += a.total; pots += a.pots; }
    else if (metric.src === 'cost') { personMin += a.personMin; pots += a.pots; }
    else { est += a.est; act += a.act; }
  }
  if (!months) return null;
  let v = null;
  if (metric.key === 'total') v = total / months;
  else if (metric.key === 'perpot') v = pots > 0 ? total / pots : null;
  else if (metric.key === 'manpot') v = pots > 0 ? (personMin / 60) / pots : null;
  else if (metric.key === 'rate') v = est > 0 ? act / est * 100 : null;
  return v == null ? null : { value: v, months };
}

function sortedProducts() {
  const { key, dir } = state.sort;
  const mul = dir === 'asc' ? 1 : -1;
  return [...state.products.values()].sort((a, b) => {
    let r;
    if (key === 'count') {
      r = (a.workN + a.yieldN) - (b.workN + b.yieldN);
      if (r === 0) r = a.code.localeCompare(b.code, 'zh-Hant', { numeric: true });
    } else {
      r = a.code.localeCompare(b.code, 'zh-Hant', { numeric: true });
    }
    return r * mul;
  });
}
function setSort(key) {
  if (state.sort.key === key) {
    state.sort.dir = state.sort.dir === 'asc' ? 'desc' : 'asc';

/** 品項卡摘要：成本兩期基準、製成率超標月數 */
function productCardSummary(code) {
  const PERIODS = costPeriods();
  const bls = PERIODS.map(p => costBaseline(code, p));
  let rateMonths = 0, rateOut = 0;
  for (const y of state.years) {
    for (let m = 1; m <= 12; m++) {
      if (!monthComplete(y, m, state.yieldRange)) continue;
      const a = state.yieldAgg.get(`${code}|${y}|${m}`);
      if (!a || a.est <= 0) continue;
      rateMonths++;
      const r = a.act / a.est * 100;
      if (r < 95 || r > 105) rateOut++;
    }
  }
  return { bls, PERIODS, rateMonths, rateOut };
}

/** 水平參考線／合理帶 plugin（依 chart.options.plugins.refs 設定繪製） */
const refPlugin = {
  id: 'refs',
  beforeDatasetsDraw(chart) {
    const cfg = chart.options.plugins.refs;
    if (!cfg) return;
    const { ctx, chartArea: area, scales: { y } } = chart;
    if (!area) return;
    ctx.save();
    if (cfg.band) {
      const y1 = y.getPixelForValue(cfg.band.from), y2 = y.getPixelForValue(cfg.band.to);
      ctx.fillStyle = cfg.band.color;
      ctx.fillRect(area.left, Math.min(y1, y2), area.right - area.left, Math.abs(y1 - y2));
    }
    for (const ln of cfg.lines || []) {
      if (ln.value == null || ln.value < y.min || ln.value > y.max) continue;
      const py = y.getPixelForValue(ln.value);
      ctx.strokeStyle = ln.color;
      ctx.lineWidth = ln.width || 1.5;
      ctx.setLineDash(ln.dash || []);
      ctx.beginPath();
      ctx.moveTo(area.left, py); ctx.lineTo(area.right, py); ctx.stroke();
      ctx.setLineDash([]);
      if (ln.label) {
        ctx.fillStyle = ln.color;
        ctx.font = '11px ' + Chart.defaults.font.family;
        ctx.textAlign = 'right';
        ctx.textBaseline = ln.labelBelow ? 'top' : 'bottom';
        ctx.fillText(ln.label, area.right - 4, ln.labelBelow ? py + 3 : py - 3);
      }
    }
    ctx.restore();
  }
};
Chart.register(refPlugin);

  };
}
function makeChart(id, cfg) {

  const ymin = Math.min(90, ...(vals.length ? [Math.floor(Math.min(...vals) - 2)] : [90]));
  const ymax = Math.max(110, ...(vals.length ? [Math.ceil(Math.max(...vals) + 2)] : [110]));
  makeChart(yid, {
    type: 'line',
    data: { labels: MONTH_LABELS, datasets: [{
      data: rdata, borderColor: color, backgroundColor: ptColors,
      pointBackgroundColor: ptColors, pointBorderColor: cssVar('--surface-1'), pointBorderWidth: 1,
      pointRadius: ptRadius, pointHoverRadius: 7,
      borderWidth: 2, spanGaps: false, tension: 0.15,
    }]},
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        refs: {
          band: { from: 95, to: 105, color: cssVar('--band') },
          lines: [
            { value: 100, color: cssVar('--text-muted'), dash: [], width: 1, label: '目標 100%', labelBelow: true },
            ...(rbl ? [{ value: rbl.value, color: cssVar('--text-muted'), dash: [6, 4], width: 1.5,
                         label: `去年平均 ${fmt(rbl.value, 1)}%` }] : []),
          ]
        },
        tooltip: {
          callbacks: {
            label: ctx => {
              const m = ctx.dataIndex + 1;
              const a = state.yieldAgg.get(`${code}|${year}|${m}`);
              const lines = [` 製成率：${fmt(ctx.parsed.y, 2)}%`];
              if (a) lines.push(` 實際 ${fmt(a.act, 0)}／預估 ${fmt(a.est, 0)}｜${a.n} 批`);
              if (ctx.parsed.y != null && (ctx.parsed.y < 95 || ctx.parsed.y > 105))
                lines.push(' ⚠ 超出合理範圍 (95%~105%)');
              return lines;
            }
          }
        }
      },
      scales: { ...baseScales('%'), y: { ...baseScales('%').y, min: ymin, max: ymax } },
    }
  });
  const outCnt = rdata.filter(v => v != null && (v < 95 || v > 105)).length;
  card.querySelector(`#lgy-${CSS.escape(code)}`).innerHTML =
    `<span class="li"><span class="sw" style="background:${cssVar('--band')};border:1px solid ${cssVar('--good')}"></span>合理範圍 95%~105%</span>
     <span class="li"><span class="sw solidline"></span>目標 100%</span>
     ${rbl ? `<span class="li"><span class="sw line"></span>去年平均</span>` : ''}
     <span class="li"><span class="sw" style="background:${cssVar('--critical')};border-radius:50%"></span>超出範圍月份${outCnt ? `（${outCnt} 個月）` : '（無）'}</span>`;

  /* ---- 數據表 ---- */
  const tw = card.querySelector(`#tblwrap-${CSS.escape(code)}`);
  if (cardTableOn.get(code)) {
    tw.classList.remove('hidden');
    tw.innerHTML = buildTable(code, year);
  }
}

function renderKpis(el, code, year) {
  let total = 0, pots = 0, days = 0, est = 0, act = 0, batches = 0;
  let cPersonMin = 0, cPots = 0, cSessions = 0;
  for (let m = 1; m <= 12; m++) {
    const a = state.workAgg.get(`${code}|${year}|${m}`);
    if (a && monthComplete(year, m, state.workRange)) { total += a.total; pots += a.pots; days += a.n; }
    const c = state.costAgg.get(`${code}|${year}|${m}`);
    if (c && monthComplete(year, m, state.costRange)) { cPersonMin += c.personMin; cPots += c.pots; cSessions += c.n; }
    const b = state.yieldAgg.get(`${code}|${year}|${m}`);
    if (b && monthComplete(year, m, state.yieldRange)) { est += b.est; act += b.act; batches += b.n; }
  }
  const manHrPerPot = cPots > 0 ? (cPersonMin / 60) / cPots : null;
  const kpis = [
    { k: `${year} 年總生產時間`, v: fmt(total, 0), u: '分', extra: `≈ ${fmt(total / 60, 1)} 小時（墻鐘趨勢）` },
    { k: '總鍋數', v: fmt(pots, 0), u: '鍋', extra: `${days} 個生產日` },
    { k: '每鍋工時', v: pots > 0 ? fmt(total / pots, 2) : '–', u: '分/鍋', extra: '墻鐘·趨勢' },
    { k: '每鍋人時', v: manHrPerPot != null ? fmt(manHrPerPot, 2) : '–', u: '人時/鍋', extra: `成本基準·${cSessions} 場` },
    { k: '年度製成率', v: est > 0 ? fmt(act / est * 100, 2) : '–', u: '%', extra: `${batches} 批` },
  ];
  el.innerHTML = kpis.map(x =>
    `<div class="kpi"><div class="k">${x.k}</div><div class="v">${x.v} <small>${x.u}</small></div>${x.extra ? `<div class="k">${x.extra}</div>` : ''}</div>`
  ).join('');
}

function buildTable(code, year) {
  const bls = {};
  for (const m of METRICS) bls[m.key] = baseline(code, year, m);
  let rows = '';
  for (let mm = 1; mm <= 12; mm++) {
    const wOK = monthComplete(year, mm, state.workRange);
    const yOK = monthComplete(year, mm, state.yieldRange);
    const cOK = monthComplete(year, mm, state.costRange);
    const a = wOK ? state.workAgg.get(`${code}|${year}|${mm}`) : null;
    const c = cOK ? state.costAgg.get(`${code}|${year}|${mm}`) : null;
    const b = yOK ? state.yieldAgg.get(`${code}|${year}|${mm}`) : null;
    const rate = b && b.est > 0 ? b.act / b.est * 100 : null;
    const manHr = c && c.pots > 0 ? (c.personMin / 60) / c.pots : null;
    rows += `<tr>
      <td>${mm} 月${(!wOK && !yOK) ? '（不足月）' : ''}</td>
      <td>${a ? fmt(a.total, 0) : '–'}</td>
      <td>${a && a.pots > 0 ? fmt(a.total / a.pots, 2) : '–'}</td>
      <td>${manHr != null ? fmt(manHr, 2) : '–'}</td>
      <td>${a ? fmt(a.pots, 0) : '–'}</td>
      <td class="${rate != null && (rate < 95 || rate > 105) ? 'bad' : ''}">${rate != null ? fmt(rate, 2) + '%' : '–'}</td>
      <td>${b ? b.n : '–'}</td>
    </tr>`;
  }
  const blRow = `<tr>
    <th>去年平均</th>
    <th>${bls.total ? fmt(bls.total.value, 0) : '–'}</th>
    <th>${bls.perpot ? fmt(bls.perpot.value, 2) : '–'}</th>
    <th>${bls.manpot ? fmt(bls.manpot.value, 2) : '–'}</th>
    <th>–</th>
    <th>${bls.rate ? fmt(bls.rate.value, 2) + '%' : '–'}</th>
    <th>–</th>
  </tr>`;
  return `<table class="mtable">
    <thead><tr><th>${year} 年</th><th>總生產時間(分)</th><th>每鍋工時(分/鍋)</th><th>每鍋人時(人時/鍋)</th><th>鍋數</th><th>製成率</th><th>批數</th></tr></thead>
    <tbody>${rows}${blRow}</tbody></table>`;
}

/* ================= 成本推估 ================= */
/** 動態期間：最新資料年 = 今年（已生產足月），前一年 = 去年度基準 */
function costPeriods() {
  const cy = state.costRange ? state.costRange.max.y : new Date().getFullYear();
  return [
    { label: `${cy - 1} 全年`, year: cy - 1, from: 1, to: 12 },
    { label: `${cy} 已生產`, year: cy, from: 1, to: 12 },
  ];
}
let costAnomOpen = false;
let costTableOpen = false;

/** 某產品某期間：加權平均每鍋人時（人時/鍋）＋批量資訊。僅計足月。 */
function costBaseline(code, p) {
  let personMin = 0, pots = 0, sessions = 0, months = 0;
  for (let m = p.from; m <= p.to; m++) {
    if (!monthComplete(p.year, m, state.costRange)) continue;
    const a = state.costAgg.get(`${code}|${p.year}|${m}`);
    if (!a) continue;
    personMin += a.personMin; pots += a.pots; sessions += a.n; months++;
  }
  if (!months || pots <= 0) return null;
  return { manHrPerPot: (personMin / 60) / pots, pots, sessions, months,
           batch: sessions > 0 ? pots / sessions : null };
}

function currentRate() {
  const v = toNum(document.getElementById('cost-rate').value);
  return v != null && v >= 0 ? v : 0;
}
/** 費率剛變更時，包裹金額的 span 會帶 flash 動畫，凸顯連動變化 */
let rateFlash = false;
function mny(html) { return `<span class="mny${rateFlash ? ' flash' : ''}">${html}</span>`; }

function renderCost() {
  if (!costTableOpen) return;   // 折疊時不重繪（展開時會呼叫）
  const rate = currentRate();
  const PERIODS = costPeriods();

  // 期間可用性提示
  const avail = PERIODS.map(p => {
    const ok = [];
    for (let m = p.from; m <= p.to; m++) if (monthComplete(p.year, m, state.costRange)) ok.push(m);
    return `${p.label}：${ok.length ? ok.length + ' 個足月' : '無足月資料'}`;
  });
  document.getElementById('cost-sub').innerHTML =
    `每鍋人力成本 = (自算總人時 ÷ 60 ÷ 總鍋數) × 費率　·　午休 12:00–13:00 已扣、前置作業已計入　·　` +
    `納入 ${state.costValid.toLocaleString()} 筆、排除異常 ${state.costAnoms.length.toLocaleString()} 筆　·　${avail.join('　')}<br>` +
    `「批量」= 平均每場鍋數（滑鼠移上看總鍋數/場次）；鍋數越多每鍋人時越低。兩期批量差異大時，成本變化會標 ⚠，提醒該差異可能來自批量而非效率。`;

  // 資料列
  const rows = [];
  for (const pr of sortedProducts()) {
    const bls = PERIODS.map(p => costBaseline(pr.code, p));
    if (bls.every(b => b == null)) continue;   // 無任何成本資料的產品不列
    rows.push({ pr, bls });
  }

  let body = '';
  for (const { pr, bls } of rows) {
    const cells = bls.map(b => {
      if (!b) return `<td class="mut gs">–</td><td class="mut">–</td><td class="mut">–</td>`;
      const cost = b.manHrPerPot * rate;
      const bt = b.batch != null
        ? `<td class="mut" title="總鍋數 ${fmt(b.pots, 0)}／${b.sessions} 場">${fmt(b.batch, 1)}</td>`
        : `<td class="mut">–</td>`;
      return `<td class="gs">${fmt(b.manHrPerPot, 3)}</td><td>${mny(`<b>${fmt(cost, 1)}</b>`)}</td>${bt}`;
    }).join('');
    let diff = '<td class="mut gs">–</td>';
    if (bls[0] && bls[1]) {
      const d = (bls[1].manHrPerPot - bls[0].manHrPerPot) / bls[0].manHrPerPot * 100;
      const bd = (bls[0].batch && bls[1].batch) ? (bls[1].batch - bls[0].batch) / bls[0].batch : 0;
      const warn = Math.abs(bd) > 0.3;
      const tip = warn ? ` title="批量差異大：${fmt(bls[0].batch, 1)} → ${fmt(bls[1].batch, 1)} 鍋/場，此成本變化可能來自批量、非純效率"` : '';
      diff = `<td class="gs ${d > 0 ? 'bad' : ''}"${tip}>${d >= 0 ? '+' : ''}${fmt(d, 1)}%${warn ? ' ⚠' : ''}</td>`;
    }
    body += `<tr><td>${pr.code}</td><td style="text-align:left">${pr.name || ''}</td>${cells}${diff}</tr>`;
  }
  if (!body) body = `<tr><td colspan="9" class="mut" style="text-align:center;padding:16px">無符合的產品成本資料</td></tr>`;

  document.getElementById('cost-table').innerHTML = `
    <table class="mtable cost-tbl">
      <colgroup>
        <col class="c-code"><col class="c-name">
        <col class="c-hr"><col class="c-cost"><col class="c-batch">
        <col class="c-hr"><col class="c-cost"><col class="c-batch">
        <col class="c-diff">
      </colgroup>
      <thead>
        <tr>
          <th rowspan="2">料號</th><th rowspan="2" class="lft">品名</th>
          <th colspan="3" class="gs p25">${PERIODS[0].label}<span class="pchip">基準</span></th>
          <th colspan="3" class="gs p26">${PERIODS[1].label}<span class="pchip">當期</span></th>
          <th rowspan="2" class="gs">每鍋成本<br>變化</th>
        </tr>
        <tr>
          <th class="gs s25">每鍋人時</th><th class="s25">每鍋成本($)</th><th class="s25">批量<br>鍋/場</th>
          <th class="gs s26">每鍋人時</th><th class="s26">每鍋成本($)</th><th class="s26">批量<br>鍋/場</th>
        </tr>
      </thead>
      <tbody>${body}</tbody>
    </table>`;

  renderCostAnoms();
}

function renderCostAnoms() {
  const el = document.getElementById('cost-anom');
  const n = state.costAnoms.length;
  if (!n) { el.innerHTML = '<span style="color:var(--good)">✓ 所有工時列均通過人時核對，無異常。</span>'; return; }
  let html = `<button id="anom-toggle">${costAnomOpen ? '▼' : '▶'} 已排除 ${n} 筆異常資料（不列入計算，請於來源修正後重新上傳）</button>`;
  if (costAnomOpen) {
    const rows = state.costAnoms.slice(0, 300).map(a =>
      `<tr><td>${a.date}</td><td>${a.code}</td><td style="text-align:left">${a.name || ''}</td><td style="text-align:left">${a.reason}</td></tr>`
    ).join('');
    html += `<div class="mtable-wrap cost-anom-list"><table class="mtable">
      <thead><tr><th>日期</th><th>料號</th><th style="text-align:left">品名</th><th style="text-align:left">異常原因</th></tr></thead>
      <tbody>${rows}</tbody></table>${n > 300 ? `<div class="note" style="margin-top:6px">僅顯示前 300 筆，共 ${n} 筆。</div>` : ''}</div>`;
  }
  el.innerHTML = html;
  const btn = document.getElementById('anom-toggle');
  if (btn) btn.addEventListener('click', () => { costAnomOpen = !costAnomOpen; renderCostAnoms(); });
}

/* ================= 品項詳情（點卡進入） ================= */
let detailCode = null;

function openDetail(code) {
  detailCode = code;
  renderDetail(code);
  const el = document.getElementById('detail-card');
  el.classList.remove('hidden');
  el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function closeDetail() {
  detailCode = null;
  for (const id of ['det-time', 'det-scatter', 'det-rate']) {
    if (state.charts[id]) { state.charts[id].destroy(); delete state.charts[id]; }
  }
  document.getElementById('detail-card').classList.add('hidden');
}

function renderDetail(code) {
  const el = document.getElementById('detail-card');
  const p = state.products.get(code);
  const rate = currentRate();
  const PERIODS = costPeriods();
  const [b0, b1] = PERIODS.map(pd => costBaseline(code, pd));
  const recs = state.costRecords.filter(r => r.code === code)
    .sort((a, b) => ymdKey(a.d) - ymdKey(b.d));
  const anoms = state.costAnoms.filter(a => a.code === code);
  const color = cssVar('--s1');

  /* ---- KPI ---- */
  const baseAvg = b0 ? b0.manHrPerPot : (b1 ? b1.manHrPerPot : null);
  const baseLbl = b0 ? `${PERIODS[0].label}平均` : (b1 ? `${PERIODS[1].label}平均` : '平均');
  let diffHtml = '–';
  if (b0 && b1) {
    const d = (b1.manHrPerPot - b0.manHrPerPot) / b0.manHrPerPot * 100;
    const bd = (b0.batch && b1.batch) ? (b1.batch - b0.batch) / b0.batch : 0;
    diffHtml = `<span style="color:${d > 0 ? 'var(--critical)' : 'var(--good)'}">${d >= 0 ? '+' : ''}${fmt(d, 1)}%</span>${Math.abs(bd) > 0.3 ? ' ⚠批量' : ''}`;
  }
  const kpi = (k, v, u, extra) =>
    `<div class="kpi"><div class="k">${k}</div><div class="v">${v} <small>${u || ''}</small></div>${extra ? `<div class="k">${extra}</div>` : ''}</div>`;
  const kpis =
    kpi(`${PERIODS[0].label}平均`, b0 ? fmt(b0.manHrPerPot, 3) : '–', '人時/鍋',
        b0 ? `${mny(`$${fmt(b0.manHrPerPot * rate, 1)}/鍋`)} · ${b0.sessions} 場 · 批量 ${fmt(b0.batch, 1)}` : '無足月資料') +
    kpi(`${PERIODS[1].label}平均`, b1 ? fmt(b1.manHrPerPot, 3) : '–', '人時/鍋',
        b1 ? `${mny(`$${fmt(b1.manHrPerPot * rate, 1)}/鍋`)} · ${b1.sessions} 場 · 批量 ${fmt(b1.batch, 1)}` : '無足月資料') +
    kpi('每鍋成本變化', diffHtml, '', b0 && b1 ? `費率 $${fmt(rate, 0)}/人時` : '') +
    kpi('明細', `${recs.length}`, '場', anoms.length ? `<span style="color:var(--critical)">另 ${anoms.length} 筆異常已排除</span>` : '無異常');

  /* ---- 逐批明細表 ---- */
  const merged = [
    ...recs.map(r => ({ t: 'ok', k: ymdKey(r.d), r })),
    ...anoms.map(a => ({ t: 'anom', k: a.dkey, a })),
  ].sort((x, y) => x.k - y.k);
  let rows = '';
  for (const m of merged) {
    if (m.t === 'anom') {
      rows += `<tr class="anomrow"><td>${m.a.date}</td><td colspan="3">—</td>
        <td colspan="4" class="reason">⚠ ${m.a.reason}（不列入計算）</td></tr>`;
      continue;
    }
    const r = m.r;
    const manHr = r.personMin / 60;
    const per = manHr / r.pots;
    let vs = '<td class="mut">–</td>';
    if (baseAvg != null) {
      const d = (per - baseAvg) / baseAvg * 100;
      vs = `<td class="${d > 0 ? 'bad' : ''}">${d >= 0 ? '+' : ''}${fmt(d, 1)}%</td>`;
    }
    rows += `<tr>
      <td>${fmtDate(r.d)}</td>
      <td><b>${fmt(r.pots, 0)}</b></td>
      <td>${fmt(r.p1, 0)}人×${fmt(r.m1, 0)}分</td>
      <td>${fmt(r.p2, 0)}人×${fmt(r.m2, 0)}分</td>
      <td>${fmt(manHr, 1)}</td>
      <td>${fmt(per, 3)}</td>
      <td class="ccol">${mny(`<b>${fmt(per * rate, 1)}</b>`)}</td>
      ${vs}</tr>`;
  }
  if (!rows) rows = `<tr><td colspan="8" class="mut" style="text-align:center;padding:14px">此品項無成本明細資料</td></tr>`;

  el.innerHTML = `
    <div class="detail-head">
      <div>
        <h2>${code}　${p && p.name ? p.name : ''}</h2>
        <div class="sub">逐批（場）生產明細與成本分析 · 異常列以紅底標示且不列入平均</div>
      </div>
      <button class="close no-print" id="det-close">✕ 關閉</button>
    </div>
    <div class="section-title" style="margin-top:14px">成本推估（費率 $${fmt(rate, 0)}/人時，可於上方修改）</div>
    <div class="dkpis">${kpis}</div>
    <div class="section-title" style="margin-top:16px">逐批明細</div>
    <div class="dtable-wrap">
      <table class="mtable">
        <thead><tr>
          <th>日期</th><th>鍋數</th><th>製造</th><th>充填</th>
          <th>總人時</th><th>每鍋人時</th><th class="ccol">每鍋成本($)</th><th>vs ${baseLbl}</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <div class="dcharts">
      <div class="full">
        <div class="dchart-title">每鍋人時 · 逐批走勢（點大小 = 鍋數）</div>
        <div class="chart-box" style="height:260px"><canvas id="det-time"></canvas></div>
        <div class="dchart-note">虛線＝${PERIODS[0].label}平均、實線＝${PERIODS[1].label}平均。點越大代表該場鍋數越多；大點通常落在低處＝批量攤薄效應。</div>
      </div>
      <div>
        <div class="dchart-title">鍋數 vs 每鍋人時（批量效應）</div>
        <div class="chart-box" style="height:240px"><canvas id="det-scatter"></canvas></div>
        <div class="dchart-note">向右下彎的分布＝固定工時被更多鍋攤薄；水平分布＝幾乎無固定工時。</div>
      </div>
      <div>
        <div class="dchart-title">月度製成率（${PERIODS[0].year} vs ${PERIODS[1].year}）</div>
        <div class="chart-box" style="height:240px"><canvas id="det-rate"></canvas></div>
        <div class="dchart-note">灰帶＝合理範圍 95%~105%（僅計足月）。</div>
      </div>
    </div>`;
  el.querySelector('#det-close').addEventListener('click', closeDetail);

  /* ---- 圖1：逐批走勢（bubble） ---- */
  const maxPots = Math.max(1, ...recs.map(r => r.pots));
  const rOf = pots => 3 + 8 * Math.sqrt(pots / maxPots);
  makeChart('det-time', {
    type: 'line',
    data: {
      labels: recs.map(r => `${r.d.y % 100}/${r.d.m}/${r.d.d}`),
      datasets: [{
        data: recs.map(r => (r.personMin / 60) / r.pots),
        borderColor: withAlpha(color, 0.35), backgroundColor: color,
        pointRadius: recs.map(r => rOf(r.pots)), pointHoverRadius: recs.map(r => rOf(r.pots) + 2),
        pointBackgroundColor: withAlpha(color, 0.75), pointBorderColor: cssVar('--surface-1'),
        borderWidth: 1.5, tension: 0.2,
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        refs: { lines: [
          ...(b0 ? [{ value: b0.manHrPerPot, color: cssVar('--text-muted'), dash: [6, 4], width: 1.5, label: `${PERIODS[0].label}平均 ${fmt(b0.manHrPerPot, 2)}` }] : []),
          ...(b1 ? [{ value: b1.manHrPerPot, color: color, dash: [], width: 1.5, label: `${PERIODS[1].label}平均 ${fmt(b1.manHrPerPot, 2)}`, labelBelow: true }] : []),
        ] },
        tooltip: { callbacks: { label: ctx => {
          const r = recs[ctx.dataIndex];
          return [` 每鍋人時：${fmt(ctx.parsed.y, 3)} 人時/鍋`,
                  ` 鍋數：${fmt(r.pots, 0)}｜總人時：${fmt(r.personMin / 60, 1)}`,
                  ` 每鍋成本：$${fmt(ctx.parsed.y * rate, 1)}`];
        } } }
      },
      scales: baseScales('人時/鍋'),
    }
  });

  /* ---- 圖2：鍋數 vs 每鍋人時 ---- */
  makeChart('det-scatter', {
    type: 'scatter',
    data: { datasets: [{
      data: recs.map(r => ({ x: r.pots, y: (r.personMin / 60) / r.pots })),
      backgroundColor: withAlpha(color, 0.65), borderColor: cssVar('--surface-1'),
      pointRadius: 5, pointHoverRadius: 7, borderWidth: 1,
    }]},
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: ctx => {
          const r = recs[ctx.dataIndex];
          return [` ${fmtDate(r.d)}｜鍋數 ${fmt(r.pots, 0)}`, ` 每鍋人時：${fmt(ctx.parsed.y, 3)}`];
        } } }
      },
      scales: {
        x: { grid: { display: false }, border: { color: cssVar('--axis') },
             ticks: { color: cssVar('--text-muted') },
             title: { display: true, text: '鍋數/場', color: cssVar('--text-muted'), font: { size: 11 } } },
        y: { grid: { color: cssVar('--grid') }, border: { display: false },
             ticks: { color: cssVar('--text-muted') },
             title: { display: true, text: '人時/鍋', color: cssVar('--text-muted'), font: { size: 11 } } }
      },
    }
  });

  /* ---- 圖3：月度製成率兩年對比 ---- */
  const rateMetric = metricByKey('rate');
  const years = [PERIODS[0].year, PERIODS[1].year];
  const yColors = [cssVar('--text-muted'), color];
  makeChart('det-rate', {
    type: 'line',
    data: { labels: MONTH_LABELS, datasets: years.map((y, i) => ({
      label: `${y} 年`,
      data: monthlySeries(code, y, rateMetric),
      borderColor: yColors[i], backgroundColor: yColors[i],
      borderWidth: i === 0 ? 1.5 : 2, borderDash: i === 0 ? [5, 4] : [],
      pointRadius: 3.5, pointHoverRadius: 6, pointBorderColor: cssVar('--surface-1'), pointBorderWidth: 1,
      spanGaps: false, tension: 0.15,
    })) },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: true, labels: { boxWidth: 18, color: cssVar('--text-muted') } },
        refs: { band: { from: 95, to: 105, color: cssVar('--band') },
                lines: [{ value: 100, color: cssVar('--text-muted'), dash: [], width: 1 }] },
      },
      scales: baseScales('%'),
    }
  });
}

/* ================= 總 render ================= */
function renderAll() {
  // 比較區（年份列＋總覽圖＋逐產品卡）僅在勾選 2 項以上時展開
  const cmp = state.selected.length >= 2 && !!state.year;
  document.getElementById('toolbar-card').classList.toggle('hidden', !cmp);
  renderOverview();
  renderCards();
}

</script>
</body>
</html>
